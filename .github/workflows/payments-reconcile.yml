name: Payments Reconcile Cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: payments-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Payments
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Payments Reconcile Endpoint
        run: |
          BACKEND_URL="${{ vars.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://backend-vakeelsetu.vercel.app"
          fi
          BACKEND_URL="${BACKEND_URL%/}"
          
          echo "Calling payments reconcile endpoint on $BACKEND_URL..."
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${BACKEND_URL}/api/internal/cron/payments-reconcile"
